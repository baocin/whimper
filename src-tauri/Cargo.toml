[workspace]

[package]
name = "whimper"
version = "0.1.0"
edition = "2021"
description = "Local voice-to-text transcription for macOS"
authors = ["Whimper"]
license = "MIT"

[lib]
name = "whimper_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Tauri framework
tauri = { version = "2.11", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"

# Async runtime
tokio = { version = "1.42", features = [
  "rt-multi-thread",
  "sync",
  "time",
  "macros",
] }

# Audio capture + resampling
cpal = "0.15"
rubato = "0.16"

# HTTP client for model download
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "stream",
  "multipart",
  "json",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Synchronization
parking_lot = "0.12"

# Futures
futures-util = "0.3"

# System info (disk space check)
sysinfo = "0.32"

# WAV encoding (for HTTP ASR server input)
hound = "3.5"

# Directories
dirs = "5"

# macOS APIs (pasteboard, CGEvent, NSWorkspace)
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"
core-graphics = "0.24"
core-foundation = "0.9"

# Linux paste + global hotkey
[target.'cfg(target_os = "linux")'.dependencies]
# Clipboard (text only; wayland-data-control enables native Wayland support)
arboard = { version = "3", default-features = false, features = [
  "wayland-data-control",
] }
# Key simulation for Ctrl+V (wayland = zwp_virtual_keyboard backend, x11rb fallback)
enigo = { version = "0.6", features = ["wayland"] }
# Raw /dev/input reading for the global hotkey (Wayland can't grab global keys)
evdev = "0.13"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
